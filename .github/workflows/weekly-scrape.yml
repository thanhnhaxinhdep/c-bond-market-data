name: Weekly HNX bond scrape

on:
  schedule:
    # 01:00 UTC Monday = 08:00 ICT Monday
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      pages:
        description: "So trang can scrape (0 = tat ca)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python hnx_pipeline.py --pages "${{ github.event.inputs.pages || '2' }}"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hnx_scraped_raw.csv hnx_bonds_processed.xlsx index.html
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly HNX bond data update"
            git push
          fi
